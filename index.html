<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Cleaner">
<meta name="theme-color" content="#000000">
<title>Photo Cleaner — выравнивание и удаление фона</title>

<!-- OpenCV -->
<script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>

<!-- JSZip -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<!-- HEIC → JPEG конвертер (для iPhone) -->
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

<style>
  :root {
    --bg: #000;
    --card: #1c1c1e;
    --card-2: #2c2c2e;
    --text: #fff;
    --muted: #8e8e93;
    --accent: #0a84ff;
    --accent-2: #30d158;
    --danger: #ff453a;
    --warn: #ff9f0a;
    --line: #38383a;
    --radius: 16px;
    --safe-top: env(safe-area-inset-top);
    --safe-bot: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    padding-top: var(--safe-top);
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .app { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(140px + var(--safe-bot)); }

  /* Header */
  .header { text-align: center; padding: 8px 0 16px; }
  .header h1 {
    font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin: 0;
    background: linear-gradient(135deg, #0a84ff, #30d158);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header p { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

  /* Settings */
  .settings {
    background: var(--card); border-radius: var(--radius); padding: 4px 16px;
    margin-bottom: 16px;
  }
  .setting-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .setting-row:last-child { border-bottom: 0; }
  .setting-row label { font-size: 15px; }
  .setting-row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  .segmented {
    display: inline-flex; background: var(--card-2); border-radius: 10px; padding: 3px;
  }
  .segmented button {
    padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
    color: var(--muted); transition: .15s;
  }
  .segmented button.active { background: #3a3a3c; color: #fff; }

  /* Upload */
  .upload {
    background: var(--card); border: 2px dashed var(--line); border-radius: var(--radius);
    padding: 28px 16px; text-align: center; margin-bottom: 16px;
    transition: border-color .2s, background .2s; cursor: pointer;
  }
  .upload:active { border-color: var(--accent); background: rgba(10,132,255,.08); }
  .upload .icon { font-size: 40px; line-height: 1; margin-bottom: 8px; }
  .upload .title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .upload .hint { font-size: 12px; color: var(--muted); }
  .upload.busy { opacity: .5; pointer-events: none; }

  /* Sticky bottom */
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(28,28,30,.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + var(--safe-bot));
    z-index: 50;
  }
  .bottom-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; }

  .btn {
    flex: 1; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 600;
    text-align: center; transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: var(--accent-2); color: #fff; }
  .btn-ghost { background: var(--card-2); color: var(--text); }

  /* Cards */
  .queue { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 12px;
    display: flex; gap: 12px; align-items: center;
    position: relative; animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card .thumb-wrap {
    width: 72px; height: 72px; flex-shrink: 0; border-radius: 12px; overflow: hidden;
    background: repeating-conic-gradient(#2c2c2e 0% 25%, #1c1c1e 0% 50%) 50% / 12px 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .card .thumb-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .card .info { flex: 1; min-width: 0; }
  .card .name {
    font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card .state {
    display: inline-block; font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 10px; margin-top: 6px;
    background: var(--card-2); color: var(--muted);
    text-transform: uppercase; letter-spacing: .3px;
  }
  .card .state.processing { background: rgba(10,132,255,.15); color: var(--accent); }
  .card .state.done { background: rgba(48,209,88,.15); color: var(--accent-2); }
  .card .state.error { background: rgba(255,69,58,.15); color: var(--danger); }
  .card .state.converting { background: rgba(255,159,10,.15); color: var(--warn); }

  .card .remove {
    position: absolute; top: 8px; right: 8px;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,.1); color: #fff;
    font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .card .remove:active { background: var(--danger); }

  .card .dl {
    margin-top: 6px; padding: 6px 12px; border-radius: 8px;
    background: var(--accent-2); color: #fff; font-size: 12px; font-weight: 600;
  }
  .card .dl:active { transform: scale(0.95); }

  /* Progress bar under each card */
  .progress {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: var(--card-2); border-radius: 0 0 var(--radius) var(--radius); overflow: hidden;
  }
  .progress .bar {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    width: 0%; transition: width .3s ease;
  }

  /* Empty */
  .empty {
    text-align: center; color: var(--muted); padding: 40px 16px;
    background: var(--card); border-radius: var(--radius); font-size: 14px;
  }
  .empty .icon { font-size: 36px; margin-bottom: 8px; display: block; opacity: .5; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; top: calc(16px + var(--safe-top));
    transform: translateX(-50%) translateY(-20px);
    background: rgba(44,44,46,.95);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: #fff; padding: 12px 20px; border-radius: 20px;
    font-size: 14px; font-weight: 500; max-width: calc(100% - 32px);
    text-align: center; z-index: 100; opacity: 0;
    pointer-events: none; transition: .3s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: rgba(255,69,58,.95); }
  .toast.success { background: rgba(48,209,88,.95); }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Photo Cleaner</h1>
    <p>Выравнивание · Удаление фона · PNG</p>
  </div>

  <!-- Настройки -->
  <div class="settings">
    <div class="setting-row">
      <div>
        <label>Размер обработки</label>
        <small>Меньше = быстрее и стабильнее на iPhone</small>
      </div>
      <div class="segmented" id="sizeSeg">
        <button data-size="1024">S</button>
        <button data-size="1536" class="active">M</button>
        <button data-size="2048">L</button>
      </div>
    </div>
    <div class="setting-row">
      <div>
        <label>Выравнивание</label>
        <small>Исправлять перспективу документа</small>
      </div>
      <div class="segmented" id="straightSeg">
        <button data-straight="on" class="active">Вкл</button>
        <button data-straight="off">Выкл</button>
      </div>
    </div>
  </div>

  <!-- Загрузка -->
  <div class="upload" id="dropZone">
    <div class="icon">📸</div>
    <div class="title">Добавить фото</div>
    <div class="hint">Поддерживаются JPG, PNG, HEIC</div>
    <input type="file" id="fileInput" accept="image/*,.heic,.heif" multiple style="display:none">
  </div>

  <div class="queue" id="queue"></div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <button class="btn btn-primary" id="processAllBtn" disabled>Обработать</button>
    <button class="btn btn-success" id="downloadZipBtn" style="display:none">Скачать ZIP</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.8/dist/index.mjs';

const $ = s => document.querySelector(s);
const fileInput = $('#fileInput');
const dropZone = $('#dropZone');
const queueEl = $('#queue');
const processAllBtn = $('#processAllBtn');
const downloadZipBtn = $('#downloadZipBtn');
const toastEl = $('#toast');

let cvReady = false;
let queue = [];

// Настройки (сохраняются в localStorage)
const settings = {
  maxSize: parseInt(localStorage.getItem('maxSize') || '1536'),
  straighten: localStorage.getItem('straighten') !== 'off'
};

// Инициализация сегментированных контролов
document.querySelectorAll('#sizeSeg button').forEach(btn => {
  if (parseInt(btn.dataset.size) === settings.maxSize) {
    document.querySelectorAll('#sizeSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  btn.onclick = () => {
    settings.maxSize = parseInt(btn.dataset.size);
    localStorage.setItem('maxSize', settings.maxSize);
    document.querySelectorAll('#sizeSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
});
document.querySelectorAll('#straightSeg button').forEach(btn => {
  if ((btn.dataset.straight === 'on') === settings.straighten) {
    document.querySelectorAll('#straightSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  btn.onclick = () => {
    settings.straighten = btn.dataset.straight === 'on';
    localStorage.setItem('straighten', settings.straighten ? 'on' : 'off');
    document.querySelectorAll('#straightSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
});

window.onOpenCvReady = () => { cvReady = true; updateControls(); };

/* ===== Toast ===== */
let toastTimer;
function toast(msg, type = '') {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + type;
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

/* ===== Добавление файлов ===== */
dropZone.onclick = () => fileInput.click();
fileInput.onchange = (e) => {
  addFiles(Array.from(e.target.files));
  fileInput.value = '';
};

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = 'var(--line)'; });
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.style.borderColor = 'var(--line)';
  if (e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files));
});

async function addFiles(files) {
  const valid = files.filter(f =>
    f.type.startsWith('image/') ||
    /\.(heic|heif)$/i.test(f.name)
  );
  if (!valid.length) return toast('Нет изображений', 'error');

  dropZone.classList.add('busy');
  toast(`Подготовка ${valid.length} фото...`);

  for (const f of valid) {
    const item = {
      id: crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random(),
      file: f,
      name: f.name,
      size: f.size,
      status: 'pending',
      resultBlob: null,
      previewUrl: null,
      resultUrl: null,
      processedBlob: null
    };
    queue.push(item);
    renderQueue();
    updateControls();

    // Подготовка: конвертация HEIC + уменьшение размера
    try {
      item.status = 'converting';
      renderQueue();

      let workingFile = f;

      // 1. HEIC/HEIF → JPEG
      if (/\.(heic|heif)$/i.test(f.name) || f.type === 'image/heic' || f.type === 'image/heif') {
        const jpegBlob = await heic2any({ blob: f, toType: 'image/jpeg', quality: 0.9 });
        workingFile = new File([jpegBlob], f.name.replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
        item.name = workingFile.name;
      }

      // 2. Сжатие до maxSize
      const resized = await resizeImage(workingFile, settings.maxSize);
      item.processedBlob = resized;
      item.previewUrl = URL.createObjectURL(resized);
      item.status = 'pending';
    } catch (e) {
      console.error(e);
      item.previewUrl = URL.createObjectURL(f);
      item.processedBlob = f;
      item.status = 'pending';
    }
    renderQueue();
    updateControls();
  }
  dropZone.classList.remove('busy');
  toast(`Готово: ${valid.length} фото в очереди`, 'success');
}

/* ===== Сжатие изображения ===== */
function resizeImage(file, maxSize) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      const scale = Math.min(1, maxSize / Math.max(width, height));
      const newW = Math.round(width * scale);
      const newH = Math.round(height * scale);

      if (scale === 1 && file.size < 2 * 1024 * 1024) {
        return resolve(file); // уже маленькое — оставляем
      }

      const canvas = document.createElement('canvas');
      canvas.width = newW;
      canvas.height = newH;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, newW, newH);

      canvas.toBlob(blob => {
        if (!blob) return reject(new Error('Ошибка сжатия'));
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
      }, 'image/jpeg', 0.92);
    };
    img.onerror = () => reject(new Error('Не удалось прочитать изображение'));
    img.src = URL.createObjectURL(file);
  });
}

/* ===== Рендер ===== */
function renderQueue() {
  if (!queue.length) {
    queueEl.innerHTML = `<div class="empty"><span class="icon">🖼️</span>Очередь пуста.<br>Добавьте фото сверху.</div>`;
    return;
  }
  queueEl.innerHTML = '';
  queue.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = item.id;

    const stateLabel = {
      pending: 'Ожидает',
      converting: 'Подготовка',
      processing: 'Обработка',
      done: 'Готово',
      error: 'Ошибка'
    }[item.status] || item.status;

    card.innerHTML = `
      <button class="remove" aria-label="Удалить">×</button>
      <div class="thumb-wrap">
        <img src="${item.resultUrl || item.previewUrl || ''}" alt="" onerror="this.style.display='none'">
      </div>
      <div class="info">
        <div class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
        <div class="meta">${formatBytes(item.size)}</div>
        <span class="state ${item.status}">${stateLabel}</span>
        ${item.status === 'done' ? `<button class="dl">Скачать PNG</button>` : ''}
      </div>
      ${item.status === 'processing' ? `<div class="progress"><div class="bar" style="width:${item.progress || 15}%"></div></div>` : ''}
    `;

    card.querySelector('.remove').onclick = (e) => { e.stopPropagation(); removeItem(item.id); };
    if (item.status === 'done') {
      card.querySelector('.dl').onclick = (e) => {
        e.stopPropagation();
        const a = document.createElement('a');
        a.href = item.resultUrl;
        a.download = `${item.name.replace(/\.[^.]+$/, '')}_no_bg.png`;
        a.click();
      };
    }
    queueEl.appendChild(card);
  });
}

function removeItem(id) {
  const i = queue.findIndex(x => x.id === id);
  if (i === -1) return;
  if (queue[i].previewUrl) URL.revokeObjectURL(queue[i].previewUrl);
  if (queue[i].resultUrl) URL.revokeObjectURL(queue[i].resultUrl);
  queue.splice(i, 1);
  renderQueue();
  updateControls();
}

function updateControls() {
  const hasPending = queue.some(x => x.status === 'pending');
  const hasDone = queue.some(x => x.status === 'done');
  processAllBtn.disabled = !cvReady || !hasPending;
  downloadZipBtn.style.display = hasDone ? 'block' : 'none';
}

/* ===== Обработка всех ===== */
processAllBtn.onclick = async () => {
  processAllBtn.disabled = true;
  const pending = queue.filter(x => x.status === 'pending');
  let done = 0, errs = 0;

  for (let i = 0; i < pending.length; i++) {
    const item = pending[i];
    item.status = 'processing';
    item.progress = 5;
    renderQueue();
    toast(`Обработка ${i + 1}/${pending.length}`);

    try {
      // 1. Выравнивание (если включено)
      let workingBlob = item.processedBlob || item.file;
      if (settings.straighten && cvReady) {
        try {
          workingBlob = await straightenImage(workingBlob);
        } catch (e) {
          console.warn('Выравнивание не удалось, продолжаем без него', e);
        }
      }
      item.progress = 60;
      renderQueue();

      // 2. Удаление фона
      const resultBlob = await imglyRemoveBackground(workingBlob, {
        output: { format: 'image/png' }
      });

      if (item.resultUrl) URL.revokeObjectURL(item.resultUrl);
      item.resultBlob = resultBlob;
      item.resultUrl = URL.createObjectURL(resultBlob);
      item.status = 'done';
      done++;
    } catch (e) {
      console.error(e);
      item.status = 'error';
      item.error = e.message;
      errs++;
    }
    renderQueue();
    updateControls();
  }
  toast(`Готово: ${done} OK, ${errs} ошибок`, errs ? 'error' : 'success');
  updateControls();
};

/* ===== ZIP ===== */
downloadZipBtn.onclick = async () => {
  const done = queue.filter(x => x.status === 'done' && x.resultBlob);
  if (!done.length) return toast('Нет готовых', 'error');
  toast('Создание ZIP...');
  const zip = new JSZip();
  done.forEach(item => {
    const base = item.name.replace(/\.[^.]+$/, '');
    zip.file(`${base}_no_bg.png`, item.resultBlob);
  });
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'photos_no_bg.zip';
  a.click();
  URL.revokeObjectURL(url);
  toast('ZIP готов', 'success');
};

/* ===== OpenCV straighten ===== */
function straightenImage(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const src = cv.imread(img);
        const gray = new cv.Mat();
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
        const edges = new cv.Mat();
        cv.Canny(gray, edges, 75, 200);
        const contours = new cv.MatVector();
        const hierarchy = new cv.Mat();
        cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

        let maxArea = 0, bestApprox = null;
        for (let i = 0; i < contours.size(); i++) {
          const cnt = contours.get(i);
          const area = cv.contourArea(cnt);
          if (area > 5000) {
            const peri = cv.arcLength(cnt, true);
            const approx = new cv.Mat();
            cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
            if (approx.rows === 4 && area > maxArea) {
              maxArea = area;
              if (bestApprox) bestApprox.delete();
              bestApprox = approx.clone();
            }
            approx.delete();
          }
          cnt.delete();
        }

        if (bestApprox) {
          const pts = [];
          for (let i = 0; i < 4; i++) pts.push({ x: bestApprox.data32S[i * 2], y: bestApprox.data32S[i * 2 + 1] });
          pts.sort((a, b) => a.y - b.y);
          const top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
          const bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);
          const o = [top[0], top[1], bottom[1], bottom[0]];

          const w = Math.max(Math.hypot(o[0].x - o[1].x, o[0].y - o[1].y), Math.hypot(o[3].x - o[2].x, o[3].y - o[2].y));
          const h = Math.max(Math.hypot(o[0].x - o[3].x, o[0].y - o[3].y), Math.hypot(o[1].x - o[2].x, o[1].y - o[2].y));

          const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [o[0].x, o[0].y, o[1].x, o[1].y, o[2].x, o[2].y, o[3].x, o[3].y]);
          const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, w, 0, w, h, 0, h]);
          const M = cv.getPerspectiveTransform(srcTri, dstTri);
          const warped = new cv.Mat();
          cv.warpPerspective(src, warped, M, new cv.Size(w, h), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

          const canvas = document.createElement('canvas');
          cv.imshow(canvas, warped);
          canvas.toBlob(b => {
            [src, gray, edges, contours, hierarchy, srcTri, dstTri, M, warped].forEach(m => m.delete && m.delete());
            if (bestApprox) bestApprox.delete();
            resolve(b);
          }, 'image/jpeg', 0.92);
        } else {
          [src, gray, edges, contours, hierarchy].forEach(m => m.delete && m.delete());
          if (bestApprox) bestApprox.delete();
          resolve(blob);
        }
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('Ошибка загрузки'));
    img.src = URL.createObjectURL(blob);
  });
}

/* ===== Утилиты ===== */
function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

renderQueue();
updateControls();
</script>
