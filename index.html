<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пакетная обработка фото: выравнивание + удаление фона</title>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
    <!-- JSZip для скачивания ZIP -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; }
        .upload-area { border: 2px dashed #ccc; padding: 40px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        .upload-area:hover { border-color: #007aff; background: #f9f9ff; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; }
        .btn-primary { background: #007aff; color: white; }
        .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
        .btn-success { background: #34c759; color: white; }
        .btn-secondary { background: #e5e5ea; color: #333; }
        .btn-danger { background: #ff3b30; color: white; }
        .status { margin: 15px 0; padding: 12px; border-radius: 8px; background: #e3f2fd; color: #1565c0; display: none; }
        .status.error { background: #ffebee; color: #c62828; }
        .status.success { background: #e8f5e9; color: #2e7d32; }
        
        /* Сетка карточек */
        .queue { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background: #fafafa; border: 1px solid #e5e5ea; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; position: relative; }
        .card .thumb { width: 100%; height: 160px; object-fit: contain; background: repeating-conic-gradient(#e0e0e0 0% 25%, white 0% 50%) 50% / 16px 16px; border-radius: 8px; }
        .card .name { font-size: 13px; margin: 8px 0 4px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card .size { font-size: 11px; color: #8e8e93; }
        .card .state { font-size: 12px; margin-top: 4px; font-weight: 600; }
        .card .state.pending { color: #8e8e93; }
        .card .state.processing { color: #007aff; }
        .card .state.done { color: #34c759; }
        .card .state.error { color: #ff3b30; }
        .card .remove { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,0.6); color: white; font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }
        .card .remove:hover { background: #ff3b30; }
        .card .download { margin-top: 8px; padding: 8px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 Пакетная обработка фото</h1>
    <p>Загрузите одно или несколько фото. Программа попытается выровнять каждое (если найден прямоугольный объект) и удалить фон, сохранив прозрачность. Все результаты можно скачать одним ZIP-архивом.</p>

    <div class="upload-area" id="dropZone">
        <p><strong>Нажмите или перетащите фото сюда (можно много)</strong></p>
        <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
    </div>

    <div class="controls">
        <button id="addMoreBtn" class="btn-secondary">+ Добавить ещё</button>
        <button id="processAllBtn" class="btn-primary" disabled>Обработать все</button>
        <button id="downloadZipBtn" class="btn-success" style="display: none;">Скачать ZIP</button>
        <button id="clearAllBtn" class="btn-danger" style="display: none;">Очистить всё</button>
    </div>

    <div class="status" id="status"></div>

    <div class="queue" id="queue"></div>
</div>

<script type="module">
    import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.8/dist/index.mjs';

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const queueEl = document.getElementById('queue');
    const processAllBtn = document.getElementById('processAllBtn');
    const downloadZipBtn = document.getElementById('downloadZipBtn');
    const addMoreBtn = document.getElementById('addMoreBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const statusDiv = document.getElementById('status');

    let cvReady = false;
    let queue = []; // { id, file, name, size, status, resultBlob }

    window.onOpenCvReady = () => {
        cvReady = true;
        console.log('OpenCV.js готов');
        updateControls();
    };

    // --- Добавление файлов ---
    dropZone.addEventListener('click', () => fileInput.click());
    addMoreBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        addFiles(Array.from(e.target.files));
        fileInput.value = '';
    });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#007aff'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#ccc'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#ccc';
        if (e.dataTransfer.files.length > 0) {
            addFiles(Array.from(e.dataTransfer.files));
        }
    });

    function addFiles(files) {
        const valid = files.filter(f => f.type.startsWith('image/'));
        if (valid.length === 0) { showStatus('Не найдено ни одного изображения.', true); return; }
        valid.forEach(file => {
            queue.push({
                id: crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random(),
                file,
                name: file.name,
                size: file.size,
                status: 'pending',
                resultBlob: null,
                previewUrl: URL.createObjectURL(file),
                resultUrl: null
            });
        });
        renderQueue();
        updateControls();
        showStatus(`Добавлено ${valid.length} фото. Всего в очереди: ${queue.length}.`, false);
    }

    // --- Отрисовка очереди ---
    function renderQueue() {
        queueEl.innerHTML = '';
        if (queue.length === 0) {
            queueEl.innerHTML = '<p style="color:#8e8e93; text-align:center; padding:20px;">Очередь пуста. Добавьте фото.</p>';
            return;
        }
        queue.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            const stateText = {
                pending: 'Ожидает',
                processing: 'Обработка...',
                done: 'Готово',
                error: 'Ошибка'
            }[item.status] || item.status;

            card.innerHTML = `
                <button class="remove" title="Удалить из очереди" data-id="${item.id}">×</button>
                <img class="thumb" src="${item.resultUrl || item.previewUrl}" alt="">
                <div class="name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
                <div class="size">${formatBytes(item.size)}</div>
                <div class="state ${item.status}">${stateText}</div>
                ${item.status === 'done' ? `<button class="btn-success download" data-id="${item.id}">Скачать PNG</button>` : ''}
            `;
            queueEl.appendChild(card);
        });

        // Кнопки "удалить"
        queueEl.querySelectorAll('.remove').forEach(btn => {
            btn.onclick = () => {
                const id = btn.dataset.id;
                removeItem(id);
            };
        });
        // Кнопки "скачать"
        queueEl.querySelectorAll('.download').forEach(btn => {
            btn.onclick = () => {
                const item = queue.find(x => x.id === btn.dataset.id);
                if (item && item.resultUrl) {
                    const a = document.createElement('a');
                    a.href = item.resultUrl;
                    a.download = `no_bg_${item.name.replace(/\.[^.]+$/, '')}.png`;
                    a.click();
                }
            };
        });
    }

    function removeItem(id) {
        const idx = queue.findIndex(x => x.id === id);
        if (idx === -1) return;
        const item = queue[idx];
        if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
        if (item.resultUrl) URL.revokeObjectURL(item.resultUrl);
        queue.splice(idx, 1);
        renderQueue();
        updateControls();
    }

    // --- Обновление состояния кнопок ---
    function updateControls() {
        const hasPending = queue.some(x => x.status === 'pending');
        const allDone = queue.length > 0 && queue.every(x => x.status === 'done' || x.status === 'error');
        const anyDone = queue.some(x => x.status === 'done');

        processAllBtn.disabled = !cvReady || !hasPending;
        downloadZipBtn.style.display = anyDone ? 'inline-block' : 'none';
        clearAllBtn.style.display = queue.length > 0 ? 'inline-block' : 'none';
    }

    // --- Обработка всех ---
    processAllBtn.addEventListener('click', async () => {
        processAllBtn.disabled = true;
        let doneCount = 0, errorCount = 0;
        const total = queue.filter(x => x.status === 'pending').length;
        let processed = 0;

        for (const item of queue) {
            if (item.status !== 'pending') continue;
            item.status = 'processing';
            renderQueue();
            showStatus(`Обработка ${processed + 1} из ${total}: ${item.name}`, false);

            try {
                let processedBlob;
                if (cvReady) {
                    try {
                        processedBlob = await straightenImage(item.file);
                    } catch (e) {
                        console.warn('Выравнивание не удалось:', e);
                        processedBlob = item.file;
                    }
                } else {
                    processedBlob = item.file;
                }

                const resultBlob = await imglyRemoveBackground(processedBlob, {
                    output: { format: 'image/png' }
                });

                if (item.resultUrl) URL.revokeObjectURL(item.resultUrl);
                item.resultBlob = resultBlob;
                item.resultUrl = URL.createObjectURL(resultBlob);
                item.status = 'done';
                doneCount++;
            } catch (err) {
                console.error('Ошибка для', item.name, err);
                item.status = 'error';
                item.error = err.message;
                errorCount++;
            }
            processed++;
            renderQueue();
            updateControls();
        }

        showStatus(`Готово. Успешно: ${doneCount}, ошибок: ${errorCount}.`, errorCount === 0);
        updateControls();
    });

    // --- Скачать ZIP ---
    downloadZipBtn.addEventListener('click', async () => {
        const doneItems = queue.filter(x => x.status === 'done' && x.resultBlob);
        if (doneItems.length === 0) { alert('Нет готовых результатов.'); return; }
        const zip = new JSZip();
        for (const item of doneItems) {
            const baseName = item.name.replace(/\.[^.]+$/, '');
            zip.file(`${baseName}_no_bg.png`, item.resultBlob);
        }
        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'photos_no_bg.zip';
        a.click();
        URL.revokeObjectURL(url);
    });

    // --- Очистить всё ---
    clearAllBtn.addEventListener('click', () => {
        if (!confirm('Удалить все фото из очереди?')) return;
        queue.forEach(item => {
            if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
            if (item.resultUrl) URL.revokeObjectURL(item.resultUrl);
        });
        queue = [];
        renderQueue();
        updateControls();
        hideStatus();
    });

    // --- Выравнивание (OpenCV.js) ---
    async function straightenImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                try {
                    let src = cv.imread(img);
                    let gray = new cv.Mat();
                    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                    cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                    let edges = new cv.Mat();
                    cv.Canny(gray, edges, 75, 200);

                    let contours = new cv.MatVector();
                    let hierarchy = new cv.Mat();
                    cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

                    let maxArea = 0;
                    let bestApprox = null;
                    for (let i = 0; i < contours.size(); i++) {
                        let cnt = contours.get(i);
                        let area = cv.contourArea(cnt);
                        if (area > 5000) {
                            let peri = cv.arcLength(cnt, true);
                            let approx = new cv.Mat();
                            cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                            if (approx.rows === 4 && area > maxArea) {
                                maxArea = area;
                                if (bestApprox) bestApprox.delete();
                                bestApprox = approx.clone();
                            }
                            approx.delete();
                        }
                        cnt.delete();
                    }

                    if (bestApprox) {
                        let points = [];
                        for (let i = 0; i < 4; i++) {
                            points.push({ x: bestApprox.data32S[i * 2], y: bestApprox.data32S[i * 2 + 1] });
                        }
                        points.sort((a, b) => a.y - b.y);
                        let top = points.slice(0, 2).sort((a, b) => a.x - b.x);
                        let bottom = points.slice(2, 4).sort((a, b) => a.x - b.x);
                        let ordered = [top[0], top[1], bottom[1], bottom[0]];

                        let width = Math.max(
                            Math.hypot(ordered[0].x - ordered[1].x, ordered[0].y - ordered[1].y),
                            Math.hypot(ordered[3].x - ordered[2].x, ordered[3].y - ordered[2].y)
                        );
                        let height = Math.max(
                            Math.hypot(ordered[0].x - ordered[3].x, ordered[0].y - ordered[3].y),
                            Math.hypot(ordered[1].x - ordered[2].x, ordered[1].y - ordered[2].y)
                        );

                        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                            ordered[0].x, ordered[0].y,
                            ordered[1].x, ordered[1].y,
                            ordered[2].x, ordered[2].y,
                            ordered[3].x, ordered[3].y
                        ]);
                        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                            0, 0, width, 0, width, height, 0, height
                        ]);
                        let M = cv.getPerspectiveTransform(srcTri, dstTri);
                        let warped = new cv.Mat();
                        cv.warpPerspective(src, warped, M, new cv.Size(width, height), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

                        let canvas = document.createElement('canvas');
                        cv.imshow(canvas, warped);
                        canvas.toBlob((blob) => {
                            src.delete(); gray.delete(); edges.delete();
                            contours.delete(); hierarchy.delete();
                            srcTri.delete(); dstTri.delete(); M.delete(); warped.delete();
                            if (bestApprox) bestApprox.delete();
                            resolve(blob);
                        }, 'image/png');
                    } else {
                        src.delete(); gray.delete(); edges.delete();
                        contours.delete(); hierarchy.delete();
                        if (bestApprox) bestApprox.delete();
                        resolve(file);
                    }
                } catch (err) {
                    reject(err);
                }
            };
            img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
            img.src = URL.createObjectURL(file);
        });
    }

    // --- Утилиты ---
    function showStatus(msg, isError) {
        statusDiv.textContent = msg;
        statusDiv.className = 'status' + (isError ? ' error' : ' success');
        statusDiv.style.display = 'block';
    }
    function hideStatus() { statusDiv.style.display = 'none'; }
    function formatBytes(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Инициализация
    renderQueue();
    updateControls();
</script>

</body>
</html>
