<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удаление фона и выравнивание фото</title>
    <!-- OpenCV.js для выравнивания -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; }
        .upload-area { border: 2px dashed #ccc; padding: 40px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        .upload-area:hover { border-color: #007aff; background: #f9f9ff; }
        .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .preview-box { text-align: center; }
        .preview-box img { max-width: 100%; max-height: 400px; border-radius: 8px; border: 1px solid #ddd; background: repeating-conic-gradient(#e0e0e0 0% 25%, white 0% 50%) 50% / 20px 20px; }
        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; }
        .btn-primary { background: #007aff; color: white; }
        .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
        .btn-success { background: #34c759; color: white; }
        .status { margin-top: 15px; padding: 10px; border-radius: 8px; background: #e3f2fd; color: #1565c0; display: none; }
        .status.error { background: #ffebee; color: #c62828; }
        #downloadLink { display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 Удаление фона + Выравнивание</h1>
    <p>Загрузите одно или несколько фото. Скрипт попытается выровнять их (если это документ/прямоугольный объект) и удалить фон, сделав его прозрачным.</p>

    <div class="upload-area" id="dropZone">
        <p><strong>Нажмите или перетащите фото сюда</strong></p>
        <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
    </div>

    <div class="controls">
        <button id="processBtn" class="btn-primary" disabled>Обработать фото</button>
        <button id="downloadBtn" class="btn-success" style="display: none;">Скачать результат (PNG)</button>
    </div>

    <div class="status" id="status"></div>

    <div class="preview-grid" id="previewGrid" style="display: none;">
        <div class="preview-box">
            <h3>Оригинал</h3>
            <img id="originalImg" alt="Оригинал">
        </div>
        <div class="preview-box">
            <h3>Результат (прозрачный фон)</h3>
            <img id="resultImg" alt="Результат">
        </div>
    </div>
</div>

<script type="module">
    // Импорт библиотеки для удаления фона через CDN (ESM)
    import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.8/dist/index.mjs';

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusDiv = document.getElementById('status');
    const previewGrid = document.getElementById('previewGrid');
    const originalImg = document.getElementById('originalImg');
    const resultImg = document.getElementById('resultImg');

    let currentFile = null;
    let cvReady = false;

    // Ждем загрузки OpenCV
    window.onOpenCvReady = () => {
        cvReady = true;
        console.log('OpenCV.js готов');
        if (currentFile) processBtn.disabled = false;
    };

    // Обработка выбора файла
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });

    // Drag & Drop
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#007aff'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#ccc'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#ccc';
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    dropZone.addEventListener('click', () => fileInput.click());

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            alert('Пожалуйста, выберите изображение.');
            return;
        }
        currentFile = file;
        const url = URL.createObjectURL(file);
        originalImg.src = url;
        previewGrid.style.display = 'grid';
        resultImg.src = '';
        downloadBtn.style.display = 'none';
        statusDiv.style.display = 'none';
        
        if (cvReady) {
            processBtn.disabled = false;
        } else {
            processBtn.disabled = true;
            showStatus('Ожидание загрузки OpenCV...', false);
        }
    }

    // Основной процесс
    processBtn.addEventListener('click', async () => {
        if (!currentFile) return;

        processBtn.disabled = true;
        downloadBtn.style.display = 'none';
        showStatus('Шаг 1/2: Выравнивание...', false);

        try {
            // 1. Выравнивание (Deskew / Perspective)
            // Если OpenCV не загрузился, пропускаем выравнивание
            let processedBlob;
            if (cvReady) {
                try {
                    processedBlob = await straightenImage(currentFile);
                } catch (e) {
                    console.warn('Выравнивание не удалось, используем оригинал:', e);
                    processedBlob = currentFile;
                }
            } else {
                processedBlob = currentFile;
            }

            // 2. Удаление фона
            showStatus('Шаг 2/2: Удаление фона (это может занять время при первом запуске)...', false);
            
            const resultBlob = await imglyRemoveBackground(processedBlob, {
                output: { format: 'image/png' }
            });

            // Показываем результат
            const resultUrl = URL.createObjectURL(resultBlob);
            resultImg.src = resultUrl;
            
            // Настраиваем кнопку скачивания
            downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = resultUrl;
                a.download = 'result_no_bg.png';
                a.click();
            };
            downloadBtn.style.display = 'inline-block';
            showStatus('Готово! Фон удален, изображение выровнено.', false);

        } catch (error) {
            console.error(error);
            showStatus('Ошибка: ' + error.message, true);
        } finally {
            processBtn.disabled = false;
        }
    });

    // Функция выравнивания на OpenCV.js
    async function straightenImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                try {
                    let src = cv.imread(img);
                    let dst = new cv.Mat();
                    
                    // Конвертация в оттенки серого
                    let gray = new cv.Mat();
                    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                    
                    // Размытие и определение краев (Canny)
                    cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                    let edges = new cv.Mat();
                    cv.Canny(gray, edges, 75, 200);
                    
                    // Поиск контуров
                    let contours = new cv.MatVector();
                    let hierarchy = new cv.Mat();
                    cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
                    
                    // Поиск наибольшего прямоугольного контура
                    let maxArea = 0;
                    let bestApprox = null;
                    
                    for (let i = 0; i < contours.size(); i++) {
                        let cnt = contours.get(i);
                        let area = cv.contourArea(cnt);
                        if (area > 1000) { // игнорируем мелкие шумы
                            let peri = cv.arcLength(cnt, true);
                            let approx = new cv.Mat();
                            cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                            
                            // Если 4 угла и площадь больше предыдущей — запоминаем
                            if (approx.rows === 4 && area > maxArea) {
                                maxArea = area;
                                if (bestApprox) bestApprox.delete();
                                bestApprox = approx.clone();
                            }
                            approx.delete();
                        }
                        cnt.delete();
                    }

                    if (bestApprox) {
                        // Сортируем углы
                        let points = [];
                        for (let i = 0; i < 4; i++) {
                            points.push({ x: bestApprox.data32S[i*2], y: bestApprox.data32S[i*2+1] });
                        }
                        points.sort((a, b) => a.y - b.y);
                        let top = points.slice(0, 2).sort((a, b) => a.x - b.x);
                        let bottom = points.slice(2, 4).sort((a, b) => a.x - b.x);
                        let ordered = [top[0], top[1], bottom[1], bottom[0]];

                        // Вычисляем размеры выходного изображения
                        let width = Math.max(
                            Math.hypot(ordered[0].x - ordered[1].x, ordered[0].y - ordered[1].y),
                            Math.hypot(ordered[3].x - ordered[2].x, ordered[3].y - ordered[2].y)
                        );
                        let height = Math.max(
                            Math.hypot(ordered[0].x - ordered[3].x, ordered[0].y - ordered[3].y),
                            Math.hypot(ordered[1].x - ordered[2].x, ordered[1].y - ordered[2].y)
                        );

                        // Матрица преобразования
                        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                            ordered[0].x, ordered[0].y,
                            ordered[1].x, ordered[1].y,
                            ordered[2].x, ordered[2].y,
                            ordered[3].x, ordered[3].y
                        ]);
                        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                            0, 0,
                            width, 0,
                            width, height,
                            0, height
                        ]);
                        let M = cv.getPerspectiveTransform(srcTri, dstTri);
                        
                        let warped = new cv.Mat();
                        cv.warpPerspective(src, warped, M, new cv.Size(width, height), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

                        // Конвертируем обратно в Blob
                        let canvas = document.createElement('canvas');
                        cv.imshow(canvas, warped);
                        canvas.toBlob((blob) => {
                            // Очистка памяти
                            src.delete(); dst.delete(); gray.delete(); edges.delete();
                            contours.delete(); hierarchy.delete(); srcTri.delete(); dstTri.delete(); M.delete(); warped.delete();
                            if (bestApprox) bestApprox.delete();
                            resolve(blob);
                        }, 'image/png');
                    } else {
                        // Если прямоугольник не найден, возвращаем оригинал
                        src.delete(); dst.delete(); gray.delete(); edges.delete();
                        contours.delete(); hierarchy.delete();
                        if (bestApprox) bestApprox.delete();
                        resolve(file);
                    }
                } catch (err) {
                    reject(err);
                }
            };
            img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
            img.src = URL.createObjectURL(file);
        });
    }

    function showStatus(msg, isError) {
        statusDiv.textContent = msg;
        statusDiv.className = 'status' + (isError ? ' error' : '');
        statusDiv.style.display = 'block';
    }
</script>

</body>
</html>
